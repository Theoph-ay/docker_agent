<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Agent</title>
    <!-- Custom PNG favicon -->
    <link rel="icon" type="image/png" href="ai-mail-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 40%, #24243e 100%);
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            padding: 18px 24px;
            background: rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(12px);
        }

        .header-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #6c63ff, #3b82f6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .header-subtitle {
            font-size: 12px;
            color: #8888aa;
            margin-top: 2px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-left: auto;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ===== CHAT AREA ===== */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        /* Custom scrollbar */
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        /* ===== MESSAGE BUBBLES ===== */
        .message {
            display: flex;
            gap: 10px;
            max-width: 75%;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.ai {
            align-self: flex-start;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #6c63ff, #3b82f6);
        }

        .message.ai .message-avatar {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 14px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #6c63ff, #3b82f6);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-bubble {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .message-bubble p {
            margin-bottom: 8px;
        }

        .message-bubble p:last-child {
            margin-bottom: 0;
        }

        .message-bubble ul, .message-bubble ol {
            margin-left: 20px;
            margin-bottom: 8px;
        }

        .message-bubble li {
            margin-bottom: 4px;
        }
        
        .message-bubble strong {
            color: #ffffff;
            font-weight: 600;
        }

        /* Markdown Text/Lists Margin Fixes */
        .message-bubble > *:first-child {
            margin-top: 0;
        }
        
        /* Markdown Tables */
        .message-bubble table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 13px;
        }

        .message-bubble th, .message-bubble td {
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 12px;
            text-align: left;
        }

        .message-bubble th {
            background: rgba(255, 255, 255, 0.08);
            font-weight: 600;
            color: #ffffff;
        }

        .message-bubble tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }

        .message-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
            padding: 0 4px;
            gap: 16px;
        }

        .message.user .message-footer {
            flex-direction: row-reverse;
        }

        .message-time {
            font-size: 11px;
            color: #666680;
        }

        .message-actions {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #666680;
            font-size: 11px;
            cursor: pointer;
            transition: color 0.2s;
            font-family: inherit;
        }

        .action-btn:hover {
            color: #a0a0b0;
            text-decoration: underline;
        }

        /* ===== THINKING INDICATOR ===== */
        .thinking {
            display: flex;
            gap: 10px;
            align-self: flex-start;
            max-width: 75%;
            animation: slideIn 0.3s ease-out;
        }

        .thinking-dots {
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .thinking-dots span {
            width: 7px;
            height: 7px;
            background: #6c63ff;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* ===== WELCOME MESSAGE ===== */
        .welcome {
            text-align: center;
            padding: 40px 20px;
            color: #8888aa;
        }

        .welcome h2 {
            font-size: 22px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .welcome p {
            font-size: 14px;
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ===== INPUT AREA ===== */
        .input-container {
            padding: 16px 24px 24px;
            background: rgba(255, 255, 255, 0.04);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
        }

        #message-input {
            flex: 1;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            resize: none;
            min-height: 48px;
            max-height: 200px;
            overflow-y: auto;
            line-height: 1.5;
        }

        #message-input::placeholder {
            color: #666680;
        }

        #message-input:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.15);
        }

        #send-btn {
            padding: 14px 24px;
            background: linear-gradient(135deg, #6c63ff, #3b82f6);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            white-space: nowrap;
        }

        #send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4);
        }

        #send-btn:active {
            transform: translateY(0);
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 12px 24px;
            font-size: 11px;
            color: #666680;
            background: rgba(255, 255, 255, 0.02);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* ===== ERROR TOAST ===== */
        .error-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(239, 68, 68, 0.95);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            z-index: 100;
            animation: fadeIn 0.3s ease-out;
            max-width: 350px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .message {
                max-width: 90%;
            }
            .header {
                padding: 14px 16px;
            }
            .chat-container {
                padding: 16px;
            }
            .input-container {
                padding: 12px 16px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="header-icon">🤖</div>
        <div>
            <div class="header-title">AI Agent Chat</div>
            <div class="header-subtitle">Email & Research Supervisor</div>
        </div>
        <div class="status-dot" title="Online"></div>
    </div>

    <!-- CHAT MESSAGES -->
    <div class="chat-container" id="chat-container">
        <div class="welcome" id="welcome-msg">
            <h2>👋 Welcome!</h2>
            <p>I'm your AI assistant. I can help with research and email management. Type a message to get started.</p>
        </div>
    </div>

    <!-- INPUT AREA -->
    <div class="input-container">
        <div class="input-wrapper">
            <textarea
                id="message-input"
                placeholder="Type your message... (Shift+Enter for new line)"
                autocomplete="off"
                rows="1"
            ></textarea>
            <button id="send-btn">Send</button>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        Built with LangChain, LangGraph, Python, Docker, HTML and CSS.
    </div>

    <script>
        // ============================
        // DOM Elements
        // ============================
        const chatContainer = document.getElementById('chat-container');
        const messageInput  = document.getElementById('message-input');
        const sendBtn       = document.getElementById('send-btn');
        const welcomeMsg    = document.getElementById('welcome-msg');

        // API base URL (same origin, so no CORS needed)
        const API_BASE = '/api/chats';

        // ============================
        // Send a chat message
        // ============================
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // Hide welcome message once user starts chatting
            if (welcomeMsg) {
                welcomeMsg.style.display = 'none';
            }

            // Show user's message bubble
            addMessage(text, 'user');
            
            // Reset textarea
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // Disable input while waiting for response
            setLoading(true);

            try {
                const response = await fetch(API_BASE + '/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => null);
                    const errMsg = errData?.detail || `Server error (${response.status})`;
                    throw new Error(errMsg);
                }

                const data = await response.json();
                const aiText = extractAIResponse(data);
                addMessage(aiText, 'ai');

            } catch (err) {
                showError(err.message || 'Something went wrong. Please try again.');
                addMessage('Sorry, I encountered an error. Please try again.', 'ai');
            } finally {
                setLoading(false);
            }
        }

        // ============================
        // Extract the AI response text
        // from the backend result
        // ============================
        function extractAIResponse(data) {
            // The backend returns { response: "AI message text" }
            if (data.response) {
                return data.response;
            }

            // Fallback: show raw JSON if unexpected format
            return JSON.stringify(data, null, 2);
        }

        // ============================
        // Add a message bubble to chat
        // ============================
        function addMessage(text, sender) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;

            const avatarEmoji = sender === 'user' ? '👤' : '🤖';
            
            // For AI, parse markdown. For user, just escape HTML.
            const bubbleContent = sender === 'ai' ? marked.parse(text) : escapeHtml(text);

            msgDiv.innerHTML = `
                <div class="message-avatar">${avatarEmoji}</div>
                <div style="flex: 1; min-width: 0;">
                    <div class="message-bubble" data-raw-text="${escapeHtml(text)}">${bubbleContent}</div>
                    <div class="message-footer">
                        <div class="message-time">${timeStr}</div>
                        <div class="message-actions">
                            <button class="action-btn" onclick="copyMessage(this)">Copy</button>
                            <button class="action-btn" onclick="editMessage(this)">Edit</button>
                        </div>
                    </div>
                </div>
            `;

            chatContainer.appendChild(msgDiv);
            scrollToBottom();
        }

        // ============================
        // Show / hide thinking indicator
        // ============================
        let thinkingEl = null;

        function setLoading(isLoading) {
            sendBtn.disabled = isLoading;
            messageInput.disabled = isLoading;

            if (isLoading) {
                // Add thinking dots
                thinkingEl = document.createElement('div');
                thinkingEl.className = 'thinking';
                thinkingEl.innerHTML = `
                    <div class="message-avatar" style="background: linear-gradient(135deg, #10b981, #059669);">🤖</div>
                    <div class="thinking-dots">
                        <span></span><span></span><span></span>
                    </div>
                `;
                chatContainer.appendChild(thinkingEl);
                scrollToBottom();
            } else {
                // Remove thinking dots
                if (thinkingEl && thinkingEl.parentNode) {
                    thinkingEl.parentNode.removeChild(thinkingEl);
                    thinkingEl = null;
                }
                messageInput.focus();
            }
        }

        // ============================
        // Load recent messages on start
        // ============================
        async function loadRecentMessages() {
            try {
                const response = await fetch(API_BASE + '/recent');
                if (!response.ok) return;

                const messages = await response.json();
                if (messages.length > 0 && welcomeMsg) {
                    welcomeMsg.style.display = 'none';
                }

                messages.forEach(function(msg) {
                    addMessage(msg.message, msg.is_ai ? 'ai' : 'user');
                });
            } catch (err) {
                // Silently ignore — recent messages are optional
                console.log('Could not load recent messages:', err.message);
            }
        }

        // ============================
        // Show error toast notification
        // ============================
        function showError(message) {
            const toast = document.createElement('div');
            toast.className = 'error-toast';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(function() {
                if (toast.parentNode) {
                    toast.parentNode.removeChild(toast);
                }
            }, 5000);
        }

        // ============================
        // Utility: scroll chat to bottom
        // ============================
        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // ============================
        // Utility: escape HTML to prevent XSS
        // ============================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================
        // Utility: Copy and Edit message
        // ============================
        function getRawText(btn) {
            const messageDiv = btn.closest('.message').querySelector('.message-bubble');
            // Unescape HTML by parsing it or read from data attribute
            const rawHtml = messageDiv.getAttribute('data-raw-text');
            const textarea = document.createElement('textarea');
            textarea.innerHTML = rawHtml;
            return textarea.value;
        }
        
        async function copyMessage(btn) {
            const text = getRawText(btn);
            try {
                await navigator.clipboard.writeText(text);
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = originalText, 2000);
            } catch (err) {
                showError('Failed to copy to clipboard.');
            }
        }

        function editMessage(btn) {
            const messageDiv = btn.closest('.message');
            const bubble = messageDiv.querySelector('.message-bubble');
            const actions = messageDiv.querySelector('.message-actions');
            const rawText = getRawText(btn);

            // Hide actions temporarily
            actions.style.display = 'none';

            // Create edit wrapper
            const editWrapper = document.createElement('div');
            editWrapper.className = 'edit-wrapper';
            editWrapper.style.width = '100%';
            
            const textarea = document.createElement('textarea');
            textarea.value = rawText;
            textarea.className = 'edit-textarea';
            textarea.style.width = '100%';
            textarea.style.minHeight = '80px';
            textarea.style.padding = '10px';
            textarea.style.borderRadius = '8px';
            textarea.style.background = 'rgba(255, 255, 255, 0.05)';
            textarea.style.border = '1px solid rgba(255, 255, 255, 0.2)';
            textarea.style.color = '#fff';
            textarea.style.fontFamily = 'inherit';
            textarea.style.marginBottom = '8px';
            textarea.style.resize = 'vertical';

            const btnContainer = document.createElement('div');
            btnContainer.style.display = 'flex';
            btnContainer.style.gap = '8px';
            btnContainer.style.justifyContent = 'flex-end';

            const saveBtn = document.createElement('button');
            saveBtn.textContent = 'Save & Submit';
            saveBtn.className = 'action-btn';
            saveBtn.style.background = '#3b82f6';
            saveBtn.style.color = '#fff';
            saveBtn.style.padding = '6px 12px';
            saveBtn.style.borderRadius = '4px';

            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = 'Cancel';
            cancelBtn.className = 'action-btn';
            cancelBtn.style.background = 'rgba(255, 255, 255, 0.1)';
            cancelBtn.style.color = '#fff';
            cancelBtn.style.padding = '6px 12px';
            cancelBtn.style.borderRadius = '4px';

            btnContainer.appendChild(cancelBtn);
            btnContainer.appendChild(saveBtn);

            editWrapper.appendChild(textarea);
            editWrapper.appendChild(btnContainer);

            // Save original content to restore on cancel
            const originalContent = bubble.innerHTML;
            bubble.innerHTML = '';
            bubble.appendChild(editWrapper);

            cancelBtn.onclick = () => {
                bubble.innerHTML = originalContent;
                actions.style.display = 'flex';
            };

            saveBtn.onclick = async () => {
                const newText = textarea.value.trim();
                if (!newText) {
                    // Empty text, just cancel
                    bubble.innerHTML = originalContent;
                    actions.style.display = 'flex';
                    return;
                }
                
                // Restore bubble to show the new text
                const isAi = messageDiv.classList.contains('ai');
                bubble.innerHTML = isAi ? marked.parse(newText) : escapeHtml(newText);
                bubble.setAttribute('data-raw-text', escapeHtml(newText));
                actions.style.display = 'flex';

                // Send the new text to the backend
                setLoading(true);

                try {
                    const response = await fetch(API_BASE + '/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: newText })
                    });

                    if (!response.ok) {
                        const errData = await response.json().catch(() => null);
                        const errMsg = errData?.detail || `Server error (${response.status})`;
                        throw new Error(errMsg);
                    }

                    const data = await response.json();
                    const aiText = extractAIResponse(data);
                    addMessage(aiText, 'ai');
                } catch (err) {
                    showError(err.message || 'Something went wrong.');
                } finally {
                    setLoading(false);
                }
            };

            textarea.focus();
        }

        // ============================
        // Event listeners
        // ============================

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Click send button
        sendBtn.addEventListener('click', sendMessage);

        // Press Enter to send (Shift+Enter for newline)
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Load recent messages when page opens
        loadRecentMessages();
    </script>

</body>
</html>
