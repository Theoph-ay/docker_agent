<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Agent</title>
    <!-- Professional SVG Mail Icon -->
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%233b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><path d="M2 4l10 8 10-8"></path></svg>'>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 40%, #24243e 100%);
            color: #e0e0e0;
            height: 100vh;
            display: flex; /* Sidebar and main layout */
            flex-direction: row;
            overflow: hidden;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px;
            background: rgba(0, 0, 0, 0.4);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(12px);
            transition: transform 0.3s ease, width 0.3s ease, padding 0.3s ease;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar.collapsed {
            width: 0;
            border-right: none;
            padding: 0;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 240px;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6c63ff, #3b82f6);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .new-chat-btn:hover {
            opacity: 0.9;
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .session-list::-webkit-scrollbar {
            width: 4px;
        }
        .session-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        .session-item {
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ccc;
            font-size: 14px;
        }

        .session-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .session-item.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-weight: 500;
        }

        .session-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .session-actions {
            display: none;
            gap: 6px;
        }

        .session-item:hover .session-actions {
            display: flex;
        }

        .session-action-btn {
            background: none;
            border: none;
            color: #8888aa;
            cursor: pointer;
            font-size: 12px;
        }

        .session-action-btn:hover {
            color: #fff;
        }

        /* Search Input */
        .search-container {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 32px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #3b82f6;
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #8888aa;
            font-size: 14px;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            padding: 18px 24px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #6c63ff, #3b82f6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .header-subtitle {
            font-size: 12px;
            color: #8888aa;
            margin-top: 2px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-left: auto;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ===== CHAT AREA ===== */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        /* Custom scrollbar */
        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        /* ===== MESSAGE BUBBLES ===== */
        .message {
            display: flex;
            gap: 10px;
            max-width: 75%;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.ai {
            align-self: flex-start;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #6c63ff, #3b82f6);
        }

        .message.ai .message-avatar {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 14px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #6c63ff, #3b82f6);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.ai .message-bubble {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .message-bubble p {
            margin-bottom: 8px;
        }

        .message-bubble p:last-child {
            margin-bottom: 0;
        }

        .message-bubble ul, .message-bubble ol {
            margin-left: 20px;
            margin-bottom: 8px;
        }

        .message-bubble li {
            margin-bottom: 4px;
        }
        
        .message-bubble strong {
            color: #ffffff;
            font-weight: 600;
        }

        .message-bubble > *:first-child {
            margin-top: 0;
        }
        
        .message-bubble table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 13px;
        }

        .message-bubble th, .message-bubble td {
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 12px;
            text-align: left;
        }

        .message-bubble th {
            background: rgba(255, 255, 255, 0.08);
            font-weight: 600;
            color: #ffffff;
        }

        .message-bubble tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }

        .message-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
            padding: 0 4px;
            gap: 16px;
        }

        .message.user .message-footer {
            flex-direction: row-reverse;
        }

        .message-time {
            font-size: 11px;
            color: #666680;
        }

        .message-actions {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #666680;
            font-size: 11px;
            cursor: pointer;
            transition: color 0.2s;
            font-family: inherit;
        }

        .action-btn:hover {
            color: #a0a0b0;
            text-decoration: underline;
        }

        /* ===== THINKING INDICATOR ===== */
        .thinking {
            display: flex;
            gap: 10px;
            align-self: flex-start;
            max-width: 75%;
            animation: slideIn 0.3s ease-out;
        }

        .thinking-dots {
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .thinking-dots span {
            width: 7px;
            height: 7px;
            background: #6c63ff;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* ===== WELCOME MESSAGE ===== */
        .welcome {
            text-align: center;
            padding: 40px 20px;
            color: #8888aa;
        }

        .welcome h2 {
            font-size: 22px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .welcome p {
            font-size: 14px;
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ===== INPUT AREA ===== */
        .input-container {
            padding: 16px 24px 24px;
            background: rgba(255, 255, 255, 0.02);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            max-width: 800px;
            margin: 0 auto;
        }

        #message-input {
            flex: 1;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            resize: none;
            min-height: 48px;
            max-height: 200px;
            overflow-y: auto;
            line-height: 1.5;
        }

        #message-input::placeholder {
            color: #666680;
        }

        #message-input:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.15);
        }

        #send-btn {
            padding: 14px 24px;
            background: linear-gradient(135deg, #6c63ff, #3b82f6);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            white-space: nowrap;
        }

        #send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4);
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 12px 24px;
            font-size: 11px;
            color: #666680;
            background: rgba(255, 255, 255, 0.01);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* ===== ERROR TOAST ===== */
        .error-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(239, 68, 68, 0.95);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            z-index: 100;
            animation: fadeIn 0.3s ease-out;
            max-width: 350px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Mobile Sidebar toggle */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                z-index: 50;
                height: 100%;
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .menu-btn {
                display: block !important;
            }
        }
        
        .menu-btn {
            display: none;
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="startNewChat()">
                <span>+</span> New Chat
            </button>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="chat-search" class="search-input" placeholder="Search chats..." oninput="filterSessions()">
            </div>
        </div>
        <div class="session-list" id="session-list">
            <!-- Sessions populate here -->
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <!-- HEADER -->
        <div class="header">
            <!-- Sidebar Desktop Toggle / Mobile Menu -->
            <button class="menu-btn" onclick="toggleSidebar()" style="display: block; font-size:18px; color: #8888aa; transition: color 0.2s;" title="Toggle Sidebar">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
            </button>
            <div class="header-icon">🤖</div>
            <div>
                <div class="header-title">AI Agent Chat</div>
                <div class="header-subtitle">Email & Research Supervisor</div>
            </div>
            <div class="status-dot" title="Online"></div>
        </div>

        <!-- CHAT MESSAGES -->
        <div class="chat-container" id="chat-container">
            <div class="welcome" id="welcome-msg">
                <h2>👋 Welcome!</h2>
                <p>I'm your AI assistant. I can help with research and email management. Start a new chat to begin.</p>
            </div>
        </div>

        <!-- INPUT AREA -->
        <div class="input-container">
            <div class="input-wrapper">
                <textarea
                    id="message-input"
                    placeholder="Type your message... (Shift+Enter for new line)"
                    autocomplete="off"
                    rows="1"
                    disabled
                ></textarea>
                <button id="send-btn" disabled>Send</button>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            Built with LangChain, LangGraph, Python, Docker, HTML and CSS. Context limit: 5 messages.
        </div>
    </div>

    <script>
        // ============================
        // DOM Elements
        // ============================
        const chatContainer = document.getElementById('chat-container');
        const messageInput  = document.getElementById('message-input');
        const sendBtn       = document.getElementById('send-btn');
        const welcomeMsg    = document.getElementById('welcome-msg');
        const sessionList   = document.getElementById('session-list');
        const sidebar       = document.getElementById('sidebar');
        const searchInput   = document.getElementById('chat-search');

        const API_BASE = '/api/chats';
        
        // State
        let currentSessionId = null;

        // Toggle Sidebar on mobile/desktop
        function toggleSidebar() {
            if (window.innerWidth <= 768) {
                // Mobile behavior (slide over)
                sidebar.classList.toggle('open');
            } else {
                // Desktop behavior (collapse width)
                sidebar.classList.toggle('collapsed');
            }
        }

        // ============================
        // Session Management
        // ============================
        
        // Filter Sessions Function 
        function filterSessions() {
            const query = searchInput.value.toLowerCase();
            const items = sessionList.querySelectorAll('.session-item');
            
            items.forEach(item => {
                const nameText = item.querySelector('.session-name').textContent.toLowerCase();
                if (nameText.includes(query)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }
        
        async function loadSessions() {
            try {
                const res = await fetch(`${API_BASE}/sessions`);
                if (!res.ok) return;
                const sessions = await res.json();
                
                sessionList.innerHTML = '';
                sessions.forEach(s => {
                    const el = document.createElement('div');
                    el.className = `session-item ${s.id === currentSessionId ? 'active' : ''}`;
                    el.innerHTML = `
                        <div class="session-name" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</div>
                        <div class="session-actions">
                            <button class="session-action-btn" title="Rename" onclick="renameSession(event, ${s.id}, '${escapeHtml(s.name).replace(/'/g, "\\'")}')">✏️</button>
                            <button class="session-action-btn" title="Delete" onclick="deleteSession(event, ${s.id})">🗑️</button>
                        </div>
                    `;
                    el.onclick = () => selectSession(s.id);
                    sessionList.appendChild(el);
                });

                // Auto select first session if none selected
                if (!currentSessionId && sessions.length > 0) {
                    selectSession(sessions[0].id);
                }
            } catch (err) {
                console.error("Failed to load sessions", err);
            }
        }

        async function startNewChat() {
            try {
                const res = await fetch(`${API_BASE}/sessions`, { method: 'POST' });
                if (!res.ok) throw new Error("Failed to create chat");
                const session = await res.json();
                await loadSessions();
                selectSession(session.id);
            } catch (err) {
                showError("Could not start a new chat.");
            }
        }

        async function selectSession(id) {
            currentSessionId = id;
            if (window.innerWidth <= 768) {
                sidebar.classList.remove('open');
            }
            
            // Enable inputs
            messageInput.disabled = false;
            sendBtn.disabled = false;

            // Reset UI
            chatContainer.innerHTML = '';
            
            // Update active state in sidebar
            document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
            loadSessions(); // Re-render to show active styling correctly

            // Fetch messages for this session
            try {
                const res = await fetch(`${API_BASE}/${id}/recent`);
                if (!res.ok) return;
                const messages = await res.json();
                
                if (messages.length === 0) {
                    // Show welcome if empty
                    chatContainer.appendChild(welcomeMsg);
                    welcomeMsg.style.display = 'block';
                } else {
                    messages.forEach(msg => {
                        addMessage(msg.message, msg.is_ai ? 'ai' : 'user');
                    });
                }
            } catch (err) {
                console.error("Could not load messages:", err);
            }
        }

        async function deleteSession(event, id) {
            event.stopPropagation();
            if (!confirm("Are you sure you want to delete this chat?")) return;
            
            try {
                const res = await fetch(`${API_BASE}/sessions/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error();
                
                if (currentSessionId === id) {
                    currentSessionId = null;
                    chatContainer.innerHTML = '';
                    chatContainer.appendChild(welcomeMsg);
                    welcomeMsg.style.display = 'block';
                    messageInput.disabled = true;
                    sendBtn.disabled = true;
                }
                
                loadSessions();
            } catch (err) {
                showError("Failed to delete chat.");
            }
        }

        async function renameSession(event, id, currentName) {
            event.stopPropagation();
            const newName = prompt("Enter new name for chat:", currentName);
            if (!newName || newName.trim() === "" || newName === currentName) return;

            try {
                const res = await fetch(`${API_BASE}/sessions/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: newName.trim() })
                });
                if (!res.ok) throw new Error();
                loadSessions();
            } catch (err) {
                showError("Failed to rename chat.");
            }
        }

        // ============================
        // Send a chat message
        // ============================
        async function sendMessage() {
            if (!currentSessionId) {
                showError("Please select or create a chat first.");
                return;
            }

            const text = messageInput.value.trim();
            if (!text) return;

            // Hide welcome
            if (welcomeMsg && welcomeMsg.parentNode === chatContainer) {
                welcomeMsg.style.display = 'none';
            }

            addMessage(text, 'user');
            
            messageInput.value = '';
            messageInput.style.height = 'auto';
            setLoading(true);

            try {
                const response = await fetch(API_BASE + '/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, session_id: currentSessionId })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => null);
                    throw new Error(errData?.detail || `Server error (${response.status})`);
                }

                const data = await response.json();
                const aiText = extractAIResponse(data);
                addMessage(aiText, 'ai');
                
                // Reload sessions to catch any auto-renaming from the backend
                loadSessions();

            } catch (err) {
                showError(err.message || 'Something went wrong.');
                addMessage('Sorry, I encountered an error. Please try again.', 'ai');
            } finally {
                setLoading(false);
            }
        }

        // ============================
        // Helpers
        // ============================
        function extractAIResponse(data) {
            return data.response ? data.response : JSON.stringify(data, null, 2);
        }

        function addMessage(text, sender) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;

            const avatarEmoji = sender === 'user' ? '👤' : '🤖';
            const bubbleContent = sender === 'ai' ? marked.parse(text) : escapeHtml(text);

            msgDiv.innerHTML = `
                <div class="message-avatar">${avatarEmoji}</div>
                <div style="flex: 1; min-width: 0;">
                    <div class="message-bubble" data-raw-text="${escapeHtml(text)}">${bubbleContent}</div>
                    <div class="message-footer">
                        <div class="message-time">${timeStr}</div>
                        <div class="message-actions">
                            <button class="action-btn" onclick="copyMessage(this)">Copy</button>
                            <button class="action-btn" onclick="editMessage(this)">Edit</button>
                        </div>
                    </div>
                </div>
            `;

            chatContainer.appendChild(msgDiv);
            scrollToBottom();
        }

        let thinkingEl = null;

        function setLoading(isLoading) {
            sendBtn.disabled = isLoading;
            messageInput.disabled = isLoading;

            if (isLoading) {
                thinkingEl = document.createElement('div');
                thinkingEl.className = 'thinking';
                thinkingEl.innerHTML = `
                    <div class="message-avatar" style="background: linear-gradient(135deg, #10b981, #059669);">🤖</div>
                    <div class="thinking-dots">
                        <span></span><span></span><span></span>
                    </div>
                `;
                chatContainer.appendChild(thinkingEl);
                scrollToBottom();
            } else {
                if (thinkingEl && thinkingEl.parentNode) {
                    thinkingEl.parentNode.removeChild(thinkingEl);
                    thinkingEl = null;
                }
                messageInput.focus();
            }
        }

        function showError(message) {
            const toast = document.createElement('div');
            toast.className = 'error-toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 5000);
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getRawText(btn) {
            const messageDiv = btn.closest('.message').querySelector('.message-bubble');
            const rawHtml = messageDiv.getAttribute('data-raw-text');
            const textarea = document.createElement('textarea');
            textarea.innerHTML = rawHtml;
            return textarea.value;
        }
        
        async function copyMessage(btn) {
            const text = getRawText(btn);
            try {
                await navigator.clipboard.writeText(text);
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = originalText, 2000);
            } catch (err) {
                showError('Failed to copy to clipboard.');
            }
        }

        function editMessage(btn) {
            const messageDiv = btn.closest('.message');
            const bubble = messageDiv.querySelector('.message-bubble');
            const actions = messageDiv.querySelector('.message-actions');
            const rawText = getRawText(btn);

            actions.style.display = 'none';

            const editWrapper = document.createElement('div');
            editWrapper.className = 'edit-wrapper';
            editWrapper.style.width = '100%';
            
            const textarea = document.createElement('textarea');
            textarea.value = rawText;
            textarea.className = 'edit-textarea';
            textarea.style.width = '100%';
            textarea.style.minHeight = '80px';
            textarea.style.padding = '10px';
            textarea.style.borderRadius = '8px';
            textarea.style.background = 'rgba(255, 255, 255, 0.05)';
            textarea.style.border = '1px solid rgba(255, 255, 255, 0.2)';
            textarea.style.color = '#fff';
            textarea.style.fontFamily = 'inherit';
            textarea.style.marginBottom = '8px';
            textarea.style.resize = 'vertical';

            const btnContainer = document.createElement('div');
            btnContainer.style.display = 'flex';
            btnContainer.style.gap = '8px';
            btnContainer.style.justifyContent = 'flex-end';

            const saveBtn = document.createElement('button');
            saveBtn.textContent = 'Save (Local Edit)';
            saveBtn.className = 'action-btn';
            saveBtn.style.background = '#3b82f6';
            saveBtn.style.color = '#fff';
            saveBtn.style.padding = '6px 12px';
            saveBtn.style.borderRadius = '4px';

            const cancelBtn = document.createElement('button');
            cancelBtn.textContent = 'Cancel';
            cancelBtn.className = 'action-btn';
            cancelBtn.style.background = 'rgba(255, 255, 255, 0.1)';
            cancelBtn.style.color = '#fff';
            cancelBtn.style.padding = '6px 12px';
            cancelBtn.style.borderRadius = '4px';

            btnContainer.appendChild(cancelBtn);
            btnContainer.appendChild(saveBtn);

            editWrapper.appendChild(textarea);
            editWrapper.appendChild(btnContainer);

            const originalContent = bubble.innerHTML;
            bubble.innerHTML = '';
            bubble.appendChild(editWrapper);

            cancelBtn.onclick = () => {
                bubble.innerHTML = originalContent;
                actions.style.display = 'flex';
            };

            saveBtn.onclick = async () => {
                const newText = textarea.value.trim();
                if (!newText) {
                    bubble.innerHTML = originalContent;
                    actions.style.display = 'flex';
                    return;
                }
                
                const isAi = messageDiv.classList.contains('ai');
                bubble.innerHTML = isAi ? marked.parse(newText) : escapeHtml(newText);
                bubble.setAttribute('data-raw-text', escapeHtml(newText));
                actions.style.display = 'flex';
                showError("Message visually edited. Note: Historical edits aren't sent to AI unless resubmitted.");
            };

            textarea.focus();
        }

        // ============================
        // Event listeners
        // ============================
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        sendBtn.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Initialize App
        loadSessions();

    </script>
</body>
</html>
